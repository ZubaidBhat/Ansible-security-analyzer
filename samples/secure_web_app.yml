---
# Example of a secure playbook following best practices
- name: Deploy secure web application
  hosts: webservers
  become: yes
  vars_files:
    - vault/credentials.yml  # Encrypted with ansible-vault
  
  tasks:
    - name: Install packages from HTTPS repository
      yum:
        name: nginx
        baseurl: https://download.example.com/packages
        state: present
    
    - name: Configure web server with specific interface binding
      lineinfile:
        path: /etc/nginx/nginx.conf
        line: "listen 127.0.0.1:8080;"
        state: present
    
    - name: Set database connection with vault variables
      template:
        src: db_config.j2
        dest: /etc/app/database.conf
        mode: '0600'
        owner: app
        group: app
      vars:
        db_password: "{{ vault_db_password }}"
        api_key: "{{ vault_api_key }}"
    
    - name: Create admin user with strong password from vault
      user:
        name: admin
        password: "{{ vault_admin_password | password_hash('sha512') }}"
        state: present
    
    - name: Configure application with strong crypto
      copy:
        content: |
          [security]
          hash_algorithm=sha256
          encryption_cipher=aes-256-gcm
        dest: /etc/app/security.conf
        mode: '0600'
    
    - name: Download application from secure source
      get_url:
        url: https://downloads.trusted-site.com/app.tar.gz
        dest: /tmp/app.tar.gz
        checksum: sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    
    - name: Set up API endpoint with environment variables
      blockinfile:
        path: /etc/app/api.conf
        block: |
          api_endpoint: https://api.example.com/v1
          access_token: "{{ lookup('env', 'API_ACCESS_TOKEN') }}"
          aws_access_key_id: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
          aws_secret_access_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
        mode: '0600'