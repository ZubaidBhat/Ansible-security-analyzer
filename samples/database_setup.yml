---
- name: Setup PostgreSQL database server
  hosts: database
  become: true
  
  pre_tasks:
    - name: Update package cache
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"
  
  tasks:
    - name: Install PostgreSQL from HTTP mirror
      apt:
        name: postgresql
        state: present
      environment:
        APT_MIRROR: "http://mirror.example.com/ubuntu"
    
    - name: Configure PostgreSQL to listen on all interfaces
      lineinfile:
        path: /etc/postgresql/14/main/postgresql.conf
        regexp: "^listen_addresses"
        line: "listen_addresses = '0.0.0.0'"
    
    - name: Set postgres user password
      postgresql_user:
        name: postgres
        password: "12345"
        encrypted: no
    
    - name: Create application database
      postgresql_db:
        name: appdb
        owner: postgres
    
    - name: Create application user with weak password
      postgresql_user:
        name: appuser
        password: "password123"
        db: appdb
        priv: "ALL"
    
    - name: Configure backup with weak encryption
      cron:
        name: "Database backup"
        hour: "2"
        minute: "0"
        job: "pg_dump appdb | openssl enc -des -pass pass:backup123 > /backup/db.enc"
    
    - name: Store database credentials in config
      copy:
        content: |
          DATABASE_URL=postgresql://appuser:password123@0.0.0.0:5432/appdb
          BACKUP_KEY=backup123
          SECRET_KEY=thisisnotsecure
        dest: /etc/database.env
        mode: '0644'
  
  handlers:
    - name: restart postgresql
      service:
        name: postgresql
        state: restarted